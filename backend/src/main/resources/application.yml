spring:
  application:
    name: frameflow-studio
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:frameflow}?connectionTimeZone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      connection-timeout: 10000
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 9MB
      file-size-threshold: 0
  sql:
    init:
      mode: never

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  tomcat:
    # Drain rejected 9 MiB uploads so clients receive the structured 413 response.
    max-swallow-size: 10MB
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        name: FF_SESSION
        path: /api
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:true}
        max-age: 8h

mybatis:
  mapper-locations: classpath*:mybatis/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    root: INFO
    com.frameflow.studio: ${APP_LOG_LEVEL:INFO}
    # Identity SQL parameters/results include credential encodings.
    com.frameflow.studio.infrastructure.dao.identity: INFO

app:
  tasks:
    mock-controls-enabled: ${MOCK_CONTROLS_ENABLED:false}
    worker-count: ${TASK_WORKER_COUNT:2}
    queue-capacity: ${TASK_QUEUE_CAPACITY:64}
  assets:
    storage-root: ${ASSET_STORAGE_ROOT:./data/assets}
