spring:
  application:
    name: frameflow-studio
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:frameflow}?connectionTimeZone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      connection-timeout: 10000
  sql:
    init:
      mode: never

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

mybatis:
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    root: INFO
    com.frameflow.studio: ${APP_LOG_LEVEL:INFO}
