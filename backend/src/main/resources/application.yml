spring:
  application:
    name: frameflow-studio
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:frameflow}?connectionTimeZone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      connection-timeout: 10000
  sql:
    init:
      mode: never

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        name: FF_SESSION
        path: /api
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:true}
        max-age: 8h

mybatis:
  mapper-locations: classpath*:mybatis/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    root: INFO
    com.frameflow.studio: ${APP_LOG_LEVEL:INFO}
    # Identity SQL parameters/results include credential encodings.
    com.frameflow.studio.infrastructure.dao.identity: INFO
