name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Compile, test and package
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Upload backend test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          if-no-files-found: error

  mysql-integration:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: frameflow_it
          MYSQL_USER: schema_test
          MYSQL_PASSWORD: ip03-${{ github.run_id }}-${{ github.run_attempt }}
          MYSQL_ROOT_PASSWORD: root-ip03-${{ github.run_id }}-${{ github.run_attempt }}
          TZ: UTC
        ports:
          - 3306/tcp
        options: >-
          --health-cmd "MYSQL_PWD=$MYSQL_PASSWORD mysql --host=127.0.0.1 --user=$MYSQL_USER --database=$MYSQL_DATABASE --execute='SELECT 1' --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify against isolated MySQL 8.4
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress -Pintegration-tests verify
        env:
          IT_DB_HOST: 127.0.0.1
          IT_DB_PORT: ${{ job.services.mysql.ports['3306'] }}
          IT_DB_NAME: frameflow_it
          IT_DB_USERNAME: schema_test
          IT_DB_PASSWORD: ip03-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload MySQL integration test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: mysql-integration-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Upload frontend test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-test-reports
          path: frontend/test-results/junit.xml
          if-no-files-found: error

  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet
      - name: Verify smoke HTTP and log boundaries
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Isolated container initialization, persistence and acceptance regression
        run: python3 scripts/acceptance-regression.py
      - name: Upload sanitized container smoke evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: compose-smoke-evidence
          path: test-results/ip16-regression.log
          if-no-files-found: error
